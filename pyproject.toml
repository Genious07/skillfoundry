[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillfoundry"
version = "0.1.0"
description = "Turn a human correction into a reusable, tested catalog procedure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillfoundry = "skillfoundry_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages/domain", "packages/evaluation", "packages/cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/domain", "packages/evaluation", "packages/cli"]
